<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tela</title>
</head>
<body>
    <header>
        <h1>Calculadora de gastos</h1>
        <p>Controle suas receitas e gastos de forma simples</p>
    </header>

    <section id="resumo">
        <div class="card" id="cardReceita">
            <h2>Receitas</h2>
            <span id="recTotal">R$0,00</span>
            <span id="recMes">R$0,00 este mês</span>
            <span id="recVariacao">0% vs mês passado</span>
        </div>
        <div class="card" id="cardSaldo">
            <h2>Saldo</h2>
            <span id="saldoTotal">R$0,00</span>
            <span id="saldoMes">R$0,00 este mês</span>
            <span id="saldoVariacao">0% vs mês passado</span>
        </div>
        <div class="card" id ="cardGasto">
            <h2>Gastos</h2>
            <span id="gastoTotal">R$0,00</span>
            <span id="gastoMes">R$0,00 este mês</span>
            <span id="gastoVariacao">0% vs mês passado</span>
        </div>
    </section>

    <form>
        <fieldset>
            <input type="number" id="ivalor" placeholder="Valor" required>
            <select name="tipo" id="itipo">
                <option value="receita">Receita</option>
                <option value="gasto">Gasto</option>
            </select>
            <input type="text" id="idescricao" placeholder="Descrição">
        </fieldset>
        <fieldset id="categorias">
            <input type="radio" name="categoria" id="isal" value="salario" required> <label for="isal">Salário</label>
            <input type="radio" name="categoria" id="ibet" value="apostas"> <label for="ibet">Apostas</label>
            <input type="radio" name="categoria" id="iali" value="alimentacao"> <label for="iali">Alimentação</label>
            <input type="radio" name="categoria" id="itra" value="transporte"> <label for="itra">Transporte</label>
        </fieldset>
        <button type="submit">Adcionar ao balanço</button>
    </form>

    <div id="listT"></div>
    <div id="graphic"></div>

    <footer>
        <p>Desenvolvido por Pedro Vama Murakami</p>
        <a href="#" target="_blank">Linkedin</a>
        <a href="#" target="_blank">Instagram</a>
    </footer>
</body>
</html>
